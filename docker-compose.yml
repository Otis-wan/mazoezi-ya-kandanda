services:
  db:
    image: postgres:16-alpine
    ports: ["5433:5432"] 
    restart: unless-stopped
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
      POSTGRES_DB: training
    volumes:
      - pgdata:/var/lib/postgresql/data
    

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

volumes:
  pgdata: